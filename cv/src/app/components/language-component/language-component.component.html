<div class="skill-progress-content">
    @for(skill of this.arrSkills; track skill.id){
     <div class="skill-progress-language-value">
        <h3 class="skill-progress-language">{{skill.name}}</h3>
        <h3 class="skill-progress-value">{{skill.level}}%</h3>
    </div>
    <mat-progress-bar color="primary" [value]="skill.level" type="determinate"> </mat-progress-bar>
    }
</div>
